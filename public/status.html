<!DOCTYPE html>
<html>
<head>
  <title>CutFlow AI - Server Status</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0a0a0f; color: #f0f0f5; padding: 2rem; }
    .status { max-width: 600px; margin: 0 auto; }
    h1 { background: linear-gradient(135deg, #7C3AED, #EC4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .check { color: #10B981; }
    .links { margin-top: 2rem; }
    .links a { display: inline-block; padding: 1rem 2rem; margin: 0.5rem; background: #1a1a28; border: 1px solid #2a2a3d; border-radius: 8px; color: #f0f0f5; text-decoration: none; }
    .links a:hover { background: #222233; border-color: #7C3AED; }
  </style>
</head>
<body>
  <div class="status">
    <h1>🎬 CutFlow AI</h1>
    <div class="check">✓ Server is running and responding!</div>
    
    <div class="links">
      <a href="/">🚀 Open Main Editor</a>
      <a href="/test.html">🧪 Test Dashboard</a>
    </div>
    
    <div style="margin-top: 2rem; color: #9898b0; font-size: 0.9rem;">
      <p><strong>Quick Start:</strong></p>
      <ol>
        <li>Click "Open Main Editor" above</li>
        <li>Get a free Gemini API key from <a href="https://aistudio.google.com/apikey" style="color: #7C3AED;">Google AI Studio</a></li>
        <li>Click ⚙️ settings, paste your key</li>
        <li>Upload a video and start editing!</li>
      </ol>
    </div>
  </div>
</body>
</html>
